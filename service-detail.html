<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var THEME_KEYS = ['1928_theme', 'theme', 't28', 'theme-1928'];
      function readStoredTheme() {
        try {
          for (var i = 0; i < THEME_KEYS.length; i++) {
            var v = localStorage.getItem(THEME_KEYS[i]);
            if (v === 'light' || v === 'dark') return v;
          }
        } catch (e) {}
        try {
          var match = document.cookie.match(/(?:^|;\s*)1928_theme=(light|dark)(?:;|$)/);
          if (match) return match[1];
        } catch (e) {}
        return 'dark';
      }

      function writeStoredTheme(t) {
        try {
          for (var i = 0; i < THEME_KEYS.length; i++) {
            localStorage.setItem(THEME_KEYS[i], t);
          }
        } catch (e) {}
        try {
          document.cookie = '1928_theme=' + t + ';path=/;max-age=31536000;SameSite=Lax';
        } catch (e) {}
      }

      var currentTheme = readStoredTheme();
      document.documentElement.setAttribute('data-theme', currentTheme);
      writeStoredTheme(currentTheme);

      window.__getGlobalTheme = readStoredTheme;
      window.__setGlobalTheme = function (next) {
        if (next !== 'light' && next !== 'dark') next = 'dark';
        document.documentElement.setAttribute('data-theme', next);
        if (document.body) document.body.setAttribute('data-theme', next);
        writeStoredTheme(next);
        window.dispatchEvent(new CustomEvent('themeChanged', { detail: { theme: next } }));
      };

      var isToggling = false;
      window.__toggleThemeGlobal = function () {
        if (isToggling) return readStoredTheme();
        isToggling = true;
        setTimeout(function () { isToggling = false; }, 200);
        var cur = document.documentElement.getAttribute('data-theme') || readStoredTheme();
        var next = cur === 'dark' ? 'light' : 'dark';
        window.__setGlobalTheme(next);
        return next;
      };

      document.addEventListener('click', function (e) {
        var btn = e.target.closest && e.target.closest('#theme-fab, #themeFab, #authThemeToggleBtn, #themeToggleBtn, .theme-btn, [data-action="toggle-theme"]');
        if (btn) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          if (window.StudioTheme && typeof window.StudioTheme.toggle === 'function') {
            window.StudioTheme.toggle();
          } else {
            window.__toggleThemeGlobal();
          }
        }
      }, true);
    })();
  </script>
