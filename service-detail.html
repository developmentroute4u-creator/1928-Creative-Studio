<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var keys = ['1928_theme', 'theme', 't28', 'theme-1928'];
        var t = "dark";
        for (var i = 0; i < keys.length; i++) {
          var v = localStorage.getItem(keys[i]);
          if (v === "light" || v === "dark") { t = v; break; }
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}

      // Early global theme listener to prevent double-toggle & handle immediate user clicks
      var isToggling = false;
      window.__toggleThemeGlobal = function () {
        if (isToggling) return;
        isToggling = true;
        setTimeout(function () { isToggling = false; }, 250);
        var activeAttr = document.documentElement.getAttribute('data-theme') || 'dark';
        var next = activeAttr === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        if (document.body) document.body.setAttribute('data-theme', next);
        try {
          var k = ['1928_theme', 'theme', 't28', 'theme-1928'];
          for (var j = 0; j < k.length; j++) localStorage.setItem(k[j], next);
        } catch (e) {}
        window.dispatchEvent(new CustomEvent('themeChanged', { detail: { theme: next } }));
      };

      document.addEventListener('click', function (e) {
        var btn = e.target.closest && e.target.closest('#theme-fab, #themeFab, #authThemeToggleBtn, #themeToggleBtn, .theme-btn, [data-action="toggle-theme"]');
        if (btn) {
          e.preventDefault();
          e.stopImmediatePropagation();
          if (window.StudioTheme && typeof window.StudioTheme.toggle === 'function') {
            window.StudioTheme.toggle();
          } else {
            window.__toggleThemeGlobal();
          }
        }
      }, true);
    })();
  </script>
