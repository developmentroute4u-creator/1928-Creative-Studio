<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Development · 1928 Creative Studio</title>
  <meta name="description" content="1928 Creative Studio — This page is currently under development." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f3ef;
      --ink: #111111;
      --ink-dim: #888888;
      --rule: rgba(0, 0, 0, 0.08);
      --cr: #c8102e;
      --cr-glow: rgba(200, 16, 46, 0.20);
      --sp: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --ink: #f2f2f2;
      --ink-dim: #777777;
      --rule: rgba(255, 255, 255, 0.10);
      --cr: #e62343;
      --cr-glow: rgba(230, 35, 67, 0.25);
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(24px, 4vh, 48px) clamp(24px, 4vw, 56px);
      transition: background .3s, color .3s;
      position: relative;
    }

    /* ── Custom Cursor ── */
    .c-dot {
      width: 6px;
      height: 6px;
      background: var(--cr);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }

    .c-ring {
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--cr);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform .12s ease-out, width .25s, height .25s;
    }

    /* ── Minimal Top Navigation ── */
    .top-bar {
      width: 100%;
      max-width: 1500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      background: var(--cr);
      border-radius: 50%;
      display: inline-block;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid var(--rule);
      color: var(--ink);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all .25s var(--sp);
    }

    .theme-btn:hover {
      border-color: var(--ink);
      transform: scale(1.08);
    }

    /* ── Creative Centered Hero Statement ── */
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 900px;
      margin: auto;
      z-index: 2;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.72rem, 0.9vw, 0.82rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cr);
      padding: 8px 18px;
      background: var(--cr-glow);
      border-radius: 999px;
      margin-bottom: clamp(24px, 3.5vh, 36px);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: var(--cr);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cr);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.8); opacity: 0.3; }
    }

    .statement-title {
      font-size: clamp(38px, 6.5vw, 92px);
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: clamp(28px, 4vh, 44px);
    }

    .statement-title em {
      font-style: italic;
      font-weight: 300;
      color: var(--cr);
      display: inline-block;
      letter-spacing: -0.02em;
    }

    .return-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      background: var(--ink);
      color: var(--bg);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      transition: all .25s var(--sp);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
    }

    .return-pill:hover {
      background: var(--cr);
      transform: translateY(-3px);
      box-shadow: 0 14px 36px var(--cr-glow);
    }

    .return-pill .arr {
      transition: transform .25s var(--sp);
    }

    .return-pill:hover .arr {
      transform: translate(3px, -3px);
    }

    /* ── Minimal Bottom Sub-Bar ── */
    .bottom-bar {
      width: 100%;
      max-width: 1500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.74rem;
      color: var(--ink-dim);
      letter-spacing: 0.08em;
      z-index: 2;
    }

    .bottom-bar a {
      color: var(--ink-dim);
      text-decoration: none;
      transition: color .2s;
    }

    .bottom-bar a:hover {
      color: var(--cr);
    }

    @media (max-width: 600px) {
      .bottom-bar {
        flex-direction: column;
        gap: 8px;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <!-- Custom Cursor -->
  <div class="c-dot" id="cDot"></div>
  <div class="c-ring" id="cRing"></div>

  <!-- Minimal Top Bar -->
  <header class="top-bar">
    <a href="index.html" class="brand-link">
      <span class="brand-title">1928</span>
      <span class="brand-dot"></span>
    </a>
    <button class="theme-btn" id="themeToggle" title="Toggle Theme">◐</button>
  </header>

  <!-- Creative Centered Label Statement -->
  <main class="center-container">
    <div class="status-pill">
      <span class="pulse-dot"></span>
      <span>1928 Creative Studio</span>
    </div>

    <h1 class="statement-title">
      This page is under <br />
      <em>development.</em>
    </h1>

    <a href="index.html" class="return-pill">
      <span>Return to Homepage</span>
      <span class="arr">↗</span>
    </a>
  </main>

  <!-- Minimal Bottom Bar -->
  <footer class="bottom-bar">
    <span>1928 Creative Studio © 2026</span>
    <span id="liveClock">Ahmedabad, India · 10:42 PM · 28°C ☀</span>
  </footer>

  <script>
    (function () {
      'use strict';

      // Live Clock
      function updateClock() {
        const clockEl = document.getElementById('liveClock');
        if (!clockEl) return;
        const now = new Date();
        const options = { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true };
        const timeStr = now.toLocaleTimeString('en-US', options);
        clockEl.textContent = `Ahmedabad, India · ${timeStr} · 28°C ☀`;
      }
      updateClock();
      setInterval(updateClock, 30000);

      // Custom Cursor
      const cDot = document.getElementById('cDot');
      const cRing = document.getElementById('cRing');
      let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
      let ringX = mouseX, ringY = mouseY;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (cDot) {
          cDot.style.left = mouseX + 'px';
          cDot.style.top = mouseY + 'px';
        }
      }, { passive: true });

      function renderCursor() {
        ringX += (mouseX - ringX) * 0.18;
        ringY += (mouseY - ringY) * 0.18;
        if (cRing) {
          cRing.style.left = ringX + 'px';
          cRing.style.top = ringY + 'px';
        }
        requestAnimationFrame(renderCursor);
      }
      renderCursor();

      // Theme Toggle Sync
      const themeToggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('theme-1928') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const curTheme = document.documentElement.getAttribute('data-theme');
          const nextTheme = curTheme === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', nextTheme);
          localStorage.setItem('theme-1928', nextTheme);
        });
      }
    })();
  </script>
</body>

</html>
